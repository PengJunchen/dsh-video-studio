name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned runtime and LUTs
        run: |
          node scripts/prepare-runtime.mjs
          npm run assets:prepare -- --download
      - name: Build complete package
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if (process.env.GITHUB_REF_NAME !== 'v' + JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
          npm run build -- --with-runtime ${{ matrix.platform }}
          npm pack ./dist --ignore-scripts
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('package.json')).version; fs.mkdirSync('release',{recursive:true}); fs.renameSync('dsh-video-studio-'+v+'.tgz','release/dsh-video-studio-'+v+'-${{ matrix.platform }}.tgz')"
      - name: Check relocated package without system Python or FFmpeg
        shell: bash
        run: node scripts/check-package.mjs release/*.tgz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: release/*.tgz
          retention-days: 3
  universal:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm run assets:prepare -- --download
      - run: npm run build && npm pack ./dist --ignore-scripts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-universal
          path: dsh-video-studio-*.tgz
          retention-days: 3
  publish:
    needs: [platform, universal]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --verify-tag --title "DSH Video Studio $GITHUB_REF_NAME" --generate-notes --prerelease --repo "$GITHUB_REPOSITORY"
