name: Build fixed runtimes
on:
  workflow_dispatch:
    inputs:
      existing_run_id:
        description: Optional successful build run to publish without rebuilding
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  build:
    if: inputs.existing_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build tools (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: brew install autoconf automake libtool nasm pkgconf
      - name: Build tools (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake autoconf automake libtool nasm pkg-config
      - name: Build locked runtime
        run: python scripts/build-runtime.py --platform ${{ matrix.platform }} --download
      - name: Check capabilities
        run: node scripts/setup-environment.mjs
      - name: Archive runtime
        run: python scripts/package-runtime.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: release/*
          retention-days: 3
  publish:
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.existing_run_id != ''))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          run-id: ${{ inputs.existing_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: runtime-*
          merge-multiple: true
          path: release
      - name: Publish fixed runtime resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(node -p "require('./runtime/manifest.json').id")
          gh release create "$id" release/* --verify-tag --title "Video Studio fixed runtimes · $id" --notes "Fixed per-platform Python, FFmpeg and vision dependencies. See runtime/README.md and the included input manifests for build sources and platform requirements." --prerelease
